[[entry]]
key = "adapter.pool_search"
title = "PoolSearchAdapter"
kind = "adapter"
import_path = "nsgablack.adapters:PoolSearchAdapter"
tags = ["adapter", "core", "solution-pool", "composition", "stagnation"]
summary = "池驱动优化组合：单解准备候选、独立种群搜索、停滞唤醒与返回竞争；使用既有 Solver 事务。"
use_when = ["需要按候选来源时点组合单解与种群算法，同时保持各 Unit 私有状态时。"]
minimal_wiring = ["from nsgablack.adapters import PoolSearchAdapter, PoolSearchSpec", "adapter = PoolSearchAdapter(producer, [PoolSearchSpec(population_a, initial_count=120), PoolSearchSpec(population_b, initial_count=80)])"]
required_companions = ["tool.solution_pool", "adapter.sa", "adapter.nsga2"]
config_keys = ["producer", "searches", "stagnation_steps", "recovery_steps", "restart_recovery", "metric", "recovery_selector"]
example_entry = "python examples/cases/solution_pool/run_project.py"

[[entry]]
key = "adapter.pool_task"
title = "PoolTaskAdapter"
kind = "adapter"
import_path = "nsgablack.adapters:PoolTaskAdapter"
tags = ["adapter", "core", "solution-pool", "subpool", "composition"]
summary = "为现有多角色调度绑定候选子池、逐起点精修进度与返回引用；子算法沿用正式步骤事务。"
use_when = ["需要从种群结果中选取多个起点，分配给独立局部搜索实例，再返回种群竞争时。"]
minimal_wiring = ["from nsgablack.adapters import PoolTaskSpec, RoleSpec", "role = RoleSpec('local', vns_factory, n_units=2, pool_task=PoolTaskSpec(select_refs, count='all', steps=5, output='refined'))"]
required_companions = ["tool.pool_task_spec", "tool.solution_pool"]
config_keys = ["inner", "spec", "role", "worker", "workers", "namespace"]
example_entry = "python examples/cases/solution_pool/cases/pool_refinement/run_solver.py --check"

[[entry]]
key = "tool.pool_task_spec"
title = "PoolTaskSpec"
kind = "tool"
import_path = "nsgablack.adapters:PoolTaskSpec"
tags = ["core", "solution-pool", "subpool", "role", "refinement"]
summary = "默认母池取解；按 Adapter 来源选投影子池，可递归发布带冻结父级的精修结果视图，沿用角色调度与恢复。"
use_when = ["通过 RoleSpec/StrategySpec 在既有 Router 中装配池任务时。"]
minimal_wiring = ["from nsgablack.adapters import PoolTaskSpec", "task = PoolTaskSpec(mode='initialize')", "local = PoolTaskSpec('elite', count='all', steps=5)"]
required_companions = ["adapter.pool_task", "tool.solution_pool"]
config_keys = ["select", "mode", "steps", "output", "request_key", "phases", "count", "distribution", "on_insufficient", "shuffle"]
example_entry = "docs/architecture/SOLUTION_POOL_CN.md"

[[entry]]
key = "example.pool_refinement"
title = "GA / VNS Subpool Refinement"
kind = "example"
import_path = "examples.cases.solution_pool.cases.pool_refinement.build_solver:build_solver"
tags = ["example", "solution-pool", "vns", "nsga2", "multi-strategy", "scaffold"]
summary = "标准 Case：选取 20 个起点、两类四实例 VNS 精修、返回 NSGA-II 成员竞争；包含基准评估与闲置保护。"
use_when = ["需要可运行的多角色子池任务装配示例时。"]
minimal_wiring = ["python examples/cases/solution_pool/cases/pool_refinement/run_solver.py --check", "python examples/cases/solution_pool/run_project.py"]
required_companions = ["adapter.pool_task", "tool.pool_task_spec"]
config_keys = ["max_steps", "pool_idle_steps"]
example_entry = "python examples/cases/solution_pool/cases/pool_refinement/run_solver.py"

[[entry]]
key = "tool.solution_pool"
title = "SolutionPool"
kind = "tool"
import_path = "nsgablack.core:SolutionPool"
tags = ["core", "solution-pool", "snapshot", "identity", "transaction"]
summary = "运行内具名候选区域与引用子池；不可原位改写版本、逻辑时间与输入游标，可选显式引用保护和闲置回收。"
use_when = ["需要显式存取、共享或按运行时点选择候选，且不传递其他算法的完整 Unit 时。"]
minimal_wiring = ["pool = solver.solution_pool", "refs = pool.select(at=pool.timestamp, stage='accepted')", "batch = solver.read_solutions(refs)"]
required_companions = ["SnapshotStore", "CandidateBatch"]
config_keys = ["region", "stage", "source", "at", "limit", "subpool", "create_subpool", "add_to_subpool", "drop_subpool", "read_raw_feedback", "subpool_metadata", "projection_subpools", "subpool_descriptor", "children_subpools", "publish_projection_subpool"]
example_entry = "python -m nsgablack catalog show tool.solution_pool"

[[entry]]
key = "tool.subpools"
title = "Projection Subpool Selectors"
kind = "tool"
import_path = "nsgablack.adapters:subpools"
tags = ["core", "solution-pool", "subpool", "moead", "projection", "refinement"]
summary = "按创建者 Adapter 实例选择全部或随机 N 个投影子池，包括上层 VNS 的派生结果；请求级无放回抽样并冻结比较参数。"
use_when = ["VNS 需要精修 MOEA/D 方向，或继续精修上层 VNS 的最终选择时。"]
minimal_wiring = ["from nsgablack.adapters import PoolTaskSpec, subpools", "task = PoolTaskSpec(subpools.random(20, adapter1), steps=3, output='refined')", "next_task = PoolTaskSpec(subpools.all(coarse_vns), steps=3, output='fine')"]
required_companions = ["adapter.moead", "adapter.pool_task", "tool.pool_task_spec"]
config_keys = ["all", "random", "creator", "count"]
example_entry = "examples/cases/solution_pool/cases/moead_refinement/README.md"

[[entry]]
key = "tool.objective_projection"
title = "ObjectiveProjection"
kind = "tool"
import_path = "nsgablack.core:ObjectiveProjection"
tags = ["core", "solution-pool", "projection", "feedback"]
summary = "可传输的 weighted_sum/tchebycheff 比较坐标；原始目标与约束证据保留。"
use_when = ["扩展方向投影生产者或检查冻结的比较参数时。"]
minimal_wiring = ["from nsgablack.core import ObjectiveProjection", "projection = ObjectiveProjection('weighted_sum', (0.8, 0.2))"]
config_keys = ["method", "weights", "reference"]
example_entry = "docs/architecture/SOLUTION_POOL_CN.md"

[[entry]]
key = "example.moead_refinement"
title = "MOEA/D / GA / VNS Direction Refinement"
kind = "example"
import_path = "examples.cases.solution_pool.cases.moead_refinement.build_solver:build_solver"
tags = ["example", "scaffold", "solution-pool", "moead", "vns", "projection"]
summary = "标准 Case：100 方向按来源选择 20 个精修后返回 MOEA/D；可启用 VNS 粗搜→VNS 细搜的嵌套派生视图。"
use_when = ["需要直接装配按方向精修而非为每对算法写转换逻辑时。"]
minimal_wiring = ["python examples/cases/solution_pool/cases/moead_refinement/run_solver.py --check", "python examples/cases/solution_pool/cases/moead_refinement/run_solver.py"]
required_companions = ["tool.subpools", "adapter.moead", "adapter.vns", "tool.pool_task_spec"]
config_keys = ["directions", "view_count", "workers", "local_steps", "fine_steps", "nested_refinement", "max_steps", "seed"]
example_entry = "examples/cases/solution_pool/cases/moead_refinement/README.md"

[[entry]]
key = "tool.solution_ref"
title = "SolutionRef"
kind = "tool"
import_path = "nsgablack.core:SolutionRef"
tags = ["solution-pool", "candidate", "identity", "version"]
summary = "同时定位候选身份和池记录版本的值引用；不以数值相等反查身份。"
use_when = ["在多个算法间传递明确的候选来源版本时。"]
minimal_wiring = ["refs = solver.store_solutions(candidate_batch)", "batch = solver.read_solutions(refs)"]
required_companions = ["tool.solution_pool"]
config_keys = ["pool_id", "record_id", "row", "candidate_token"]
example_entry = "python -m nsgablack catalog show tool.solution_ref"

[[entry]]
key = "tool.solution_stamp"
title = "SolutionStamp"
kind = "tool"
import_path = "nsgablack.core:SolutionStamp"
tags = ["solution-pool", "logical-time", "run", "recovery"]
summary = "运行身份与池逻辑序号定义可见截止点；失败后保留时钟高水位，墙钟不参与排序。"
use_when = ["锁定串行、恢复或融合的候选来源时点时。"]
minimal_wiring = ["stamp = solver.solution_pool.timestamp", "refs = solver.solution_pool.select(at=stamp)"]
required_companions = ["tool.solution_pool"]
config_keys = ["run_id", "sequence", "generation", "attempt"]
example_entry = "python -m nsgablack catalog show tool.solution_stamp"

[[entry]]
key = "tool.pool_retention_policy"
title = "PoolRetentionPolicy"
kind = "tool"
import_path = "nsgablack.core:PoolRetentionPolicy"
tags = ["core", "solution-pool", "retention", "snapshot", "recovery"]
summary = "按已提交步数回收无人持有候选，保留指定发布窗口与显式固定的值闭包；不限制池容量。"
use_when = ["长期运行需要释放闲置候选存储，且 Adapter 已显式声明全部活引用时。"]
minimal_wiring = ["from nsgablack.core import PoolRetentionPolicy", "solver.set_solution_pool_retention(PoolRetentionPolicy(idle_steps=20, retained_publications=2))"]
required_companions = ["tool.solution_pool"]
config_keys = ["idle_steps", "retained_publications"]
example_entry = "python -m nsgablack catalog show tool.pool_retention_policy"

[[entry]]
key = "doc.architecture.solution_pool"
title = "解池运行契约"
kind = "doc"
import_path = "nsgablack.docs_registry:doc_architecture_solution_pool"
tags = ["doc", "solution-pool", "unit", "composition", "recovery"]
summary = "池先启动、候选身份、引用子池与角色任务、独立配额/容量、闲置回收和恢复窗口的正式契约。"
use_when = ["理解候选存放与算法结构分工，或装配池驱动多算法组合时。"]
minimal_wiring = ["Open docs/architecture/SOLUTION_POOL_CN.md"]
config_keys = ["region", "stage", "source", "at"]
example_entry = "docs/architecture/SOLUTION_POOL_CN.md"

[[entry]]
key = "example.solution_pool"
title = "Pool Search Prepare / Recover / Return"
kind = "example"
import_path = "examples.cases.solution_pool.cases.pool_search.build_solver:build_solver"
tags = ["example", "solution-pool", "sa", "nsga2", "nsga3", "scaffold"]
summary = "标准 Project/Case：准备池候选、双种群搜索、停滞重启 SA 与返回竞争，L0 由 Project 授权。"
use_when = ["需要可运行的池驱动组合起点时。"]
minimal_wiring = ["python examples/cases/solution_pool/cases/pool_search/run_solver.py --check", "python examples/cases/solution_pool/run_project.py"]
config_keys = ["max_steps", "pool_idle_steps", "pool_retained_publications"]
example_entry = "python examples/cases/solution_pool/run_project.py"
