[[entry]]
key = "repr.unit_candidate"
title = "CandidateUnitBuilder"
kind = "representation"
import_path = "nsgablack.representation:CandidateUnitBuilder"
example_entry = "docs/catalog_usage/NSGABLACK_COMPONENT_USAGE_CN.md"
tags = ["core", "unit", "candidate", "construction", "codec"]
summary = "保留候选语义的轻量 Unit 构建器；由 Adapter 经独立 UnitBinding 使用，构建与恢复不执行搜索或求值。"
