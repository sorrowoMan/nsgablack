config_keys = []
companions = ["tool.unit_binding"]
required_companions = ["tool.unit_binding"]
contract = { catalog = { role = "unit_builder", concepts = ["Unit结构构建", "自定义Unit", "UnitBinding", "算法结构恢复"], operations = ["build", "dump", "restore"], boundaries = ["装配 builder 不创建运行 Unit；恢复走 codec，不重新随机构建。", "不初始化候选、不执行问题 repair、不计算目标或决定成员选择。"] } }

