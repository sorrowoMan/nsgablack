[[entry]]
key = "adapter.astar"
title = "AStarAdapter"
kind = "adapter"
import_path = "nsgablack.adapters.astar:AStarAdapter"
example_entry = "docs/catalog_usage/NSGABLACK_COMPONENT_USAGE_CN.md"
minimal_wiring = [
  "import numpy as np",
  "from nsgablack.adapters import AStarAdapter",
  "def neighbors(state, context):",
  "    return [np.asarray(state) + 1.0]",
  "adapter = AStarAdapter(neighbors=neighbors, start_state=np.array([0.0]),",
  "    goal_test=lambda state, context: state[0] >= 3,",
  "    edge_cost=lambda parent, child, context: 1.0)",
  "solver.set_adapter(adapter)",
]
tags = ["adapter", "astar", "core", "graph", "heuristic", "pathfinding", "strategy"]
summary = "A* 搜索内核：UnitBinding 构建节点，Adapter 决定扩展与优先级；显式 pool_start_policy='new_root' 从池初始化并保留节点精确版本，不继承旧路径代价。"
config_keys = ["pool_start_policy", "cost_mode", "repair_policy"]

