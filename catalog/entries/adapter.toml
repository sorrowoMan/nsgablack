# Canonical adapter catalog shard.

[[entry]]
key = "adapter.search_plan"
title = "SearchPlanAdapter"
kind = "adapter"
import_path = "nsgablack.adapters:SearchPlanAdapter"
tags = ["adapter", "core", "composition", "orchestration", "serial", "multi", "repeat", "pool"]
summary = "自然搜索编排：共享可恢复游标表达串行、并行和有限循环；复用唯一算法实例、Router评估与池任务，不手算全局代数。"
config_keys = ["plan", "strategies", "config", "working_pool", "until", "metrics", "name", "priority"]
use_when = ["重复GA→精修→同GA返回竞争，或需要任意层级serial/multi/repeat与局部额度时。"]
minimal_wiring = [
  "from nsgablack.adapters import SearchPlanAdapter, StrategySpec, stage, serial, repeat",
  "plan = repeat(times=100, body=serial(stage('ga', steps=100), stage('vns', steps=30)))",
  "solver.set_adapter(SearchPlanAdapter(plan, strategies=[StrategySpec(ga, 'ga'), StrategySpec(vns, 'vns')]))",
  "# Pool精修叶省略steps，使用PoolTaskSpec.steps指定每起点额度，等待本次任务全部完成。",
]
example_entry = "docs/architecture/NATURAL_SEARCH_PLANS_CN.md"
companions = ["tool.pool_task_spec", "tool.subpools", "adapter.serial_strategy", "adapter.multi_strategy"]
contract = { catalog = { role = "orchestration", concepts = ["GA停滞VNS精修", "GA加VNS", "串行并行", "多重嵌套", "编排", "有限循环"], operations = ["stage", "serial", "multi", "repeat"], boundaries = ["复用共享 ExecutionPlan/ExecutionCursor 与 Router，不再建立资源授权者。", "停滞触发须显式 until/metrics 或既有阶段策略，serial 顺序本身不推断停滞。", "精修阶段等待 PoolTask 本请求完成；控制切换不制造逻辑 generation。"] } }

[[entry]]
key = "adapter.fixed_candidate"
title = "FixedCandidateAdapter"
kind = "adapter"
import_path = "nsgablack.adapters.fixed_candidate:FixedCandidateAdapter"
example_entry = "docs/catalog_usage/NSGABLACK_COMPONENT_USAGE_CN.md"
tags = ["adapter", "core", "one-shot", "evaluation", "provider-neutral"]
summary = "固定候选评估策略：把 Representation 生成的单个候选送入标准 Solver 生命周期，不创建第二套控制循环。 / One-shot fixed-candidate evaluation through the canonical Solver lifecycle."
config_keys = ["initializer"]
use_when = [
  "诊断、验证或闭式任务仍需统一 cancellation、resource、plugin、result 与 lineage 语义时。",
]
minimal_wiring = [
  "import numpy as np",
  "from nsgablack.adapters import FixedCandidateAdapter",
  "class FixedSeed:",
  "    stateless = True",
  "    def checkpoint_identity(self): return {'name': 'fixed_seed', 'version': 1}",
  "    def initialize(self, problem, context): return np.array([0.25, 0.75])",
  "adapter = FixedCandidateAdapter(initializer=FixedSeed())",
  "solver.set_adapter(adapter)",
]

[[entry]]
key = "adapter.gradient_optimizer"
title = "GradientOptimizerAdapter"
kind = "adapter"
import_path = "nsgablack.adapters.gradient_optimizer:GradientOptimizerAdapter"
example_entry = "docs/catalog_usage/NSGABLACK_COMPONENT_USAGE_CN.md"
tags = ["adapter", "core", "gradient", "sgd", "adam", "adamw", "provider-neutral", "state-transition"]
summary = "通用一阶优化：SGD/Adam/AdamW 消费 Provider 梯度，支持普通池精修并交付已评估任务最佳；目标单独投影不冒充梯度变换。Provider slot 事务与资源授权保留原边界。"
use_when = [
  "Problem/Evaluation Provider 能返回 Feedback.gradients 时。",
  "需要让同一个 SGD/Adam/AdamW 策略跨 NumPy、Torch、JAX 或解析梯度 Provider 复用时。",
]
minimal_wiring = [
  "from nsgablack.adapters.gradient_optimizer import GradientOptimizerAdapter",
  "adapter = GradientOptimizerAdapter()",
  "solver.set_adapter(adapter)",
]
context_provides = ["mutation_sigma", "adapter_best_score"]
context_notes = [
  "Device/backend selection belongs to the Evaluation Provider and Project L0 grant.",
]

[[entry]]
key = "adapter.gaussian_search"
title = "GaussianSearchAdapter"
kind = "adapter"
import_path = "nsgablack.adapters.gaussian_search:GaussianSearchAdapter"
example_entry = "docs/catalog_usage/NSGABLACK_COMPONENT_USAGE_CN.md"
