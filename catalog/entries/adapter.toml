[[entry]]
key = "adapter.composite"
title = "CompositeAdapter"
kind = "adapter"
import_path = "nsgablack.adapters.algorithm_adapter:CompositeAdapter"
example_entry = "docs/catalog_usage/NSGABLACK_COMPONENT_USAGE_CN.md"
minimal_wiring = [
  "from nsgablack.adapters import CompositeAdapter, NSGA2Adapter",
  "from nsgablack.representation import GaussianMutation",
  "wide = NSGA2Adapter(name='wide', population_size=4, offspring_size=4, mutator=GaussianMutation(sigma=0.4))",
  "narrow = NSGA2Adapter(name='narrow', population_size=4, offspring_size=4, mutator=GaussianMutation(sigma=0.05))",
  "solver.set_adapter(CompositeAdapter([wide, narrow]))",
]
