[[entry]]
key = "bias.risk"
title = "RiskBias"
kind = "bias"
import_path = "nsgablack.bias.domain.risk_bias:RiskBias"
tags = ["bias", "cvar", "domain", "risk", "worst_case", "soft-preference"]
summary = "消费每候选场景统计的风险软评分：均值加波动的 CVaR 近似或最坏观测；保留原始反馈与硬约束接纳语义。"
use_when = [
  "每候选反馈已有 mc_mean/mc_std 等场景统计，希望在原始目标之外加入风险软偏好时。",
  "希望用 mean+sqrt(1/alpha)*std_scale*std 的近似评分或 mc_max 最坏观测引导选择，并能分别核对原始评价与偏好增量时。",
]
minimal_wiring = [
  "from nsgablack.bias import BiasModule, RiskBias",
  "bias_module = BiasModule()",
  "bias_module.add(RiskBias(weight=0.2, mode='cvar', alpha=0.2, std_scale=1.0, metric_prefix='mc'))",
  "solver.set_bias_module(bias_module)",
  "# The evaluation provider must supply this candidate's mc_mean/std/min/max metrics.",
]
required_companions = ["(none)"]
config_keys = ["name", "weight", "mode", "alpha", "std_scale", "metric_prefix", "mandatory"]
companions = ["plugin.monte_carlo_eval"]
example_entry = "docs/catalog_usage/NSGABLACK_COMPONENT_USAGE_CN.md"
context_requires = ["problem_data", "metrics.mc_mean", "metrics.mc_std", "metrics.mc_min", "metrics.mc_max"]
context_provides = []
context_mutates = []
context_cache = []
context_notes = [
  "运行类声明 requires_metrics=(mc_mean, mc_std, mc_min, mc_max)，由当前候选 Feedback.metrics 进入 OptimizationContext.metrics；默认 metric_prefix='mc'。",
  "metrics_fallback='safe_zero'；cvar 模式缺少可解释 mean/std 时 compute 返回 0，不能据无异常声称风险引导生效。",
  "其它正式 Evaluation Provider 也可供给这些候选局部统计，plugin.monte_carlo_eval 只是可选配套。",
]
contract = { catalog = { role = "soft_preference", concepts = ["风险软偏好", "场景统计", "CVaR近似", "最坏观测"], operations = ["compute"], boundaries = ["cvar 模式是 mean+sqrt(1/alpha)*std_scale*std 的近似评分，不等于样本尾部均值；worst_case 优先读取 mc_max，须核对损失方向。", "依赖每候选指标而非某个固定 Provider；safe_zero 回退不证明风险评分已生效，改变 metric_prefix 时须同步实际指标名。", "仅形成加权软偏好，不替代原始场景评价、不擦除 raw feedback，也不能绕过原始硬约束接纳。"] } }

