[[entry]]
key = "bias.preference"
title = "PreferenceBias"
kind = "bias"
import_path = "nsgablack.bias.domain.constraint:PreferenceBias"
tags = ["bias", "domain", "preference"]
summary = "将偏好函数返回值加到最小化选择目标；正值是成本，奖励须显式返回负值。"
use_when = [
  "需要在不改动硬约束的前提下注入软偏好引导时。 / Need to inject soft preference guidance without changing hard constraints.",
]
minimal_wiring = [
  "from nsgablack.bias import BiasModule, PreferenceBias",
  "bias_module = BiasModule()",
  "preference = PreferenceBias(weight=1.0, preference_functions=[lambda x: 0.25 * float(((x - 1.0) ** 2).sum())])",
  "bias_module.add(preference)",
  "solver.set_bias_module(bias_module, enable=True)",
]
required_companions = ["bias.module"]
config_keys = ["weight", "aspiration_levels", "preference_functions"]
example_entry = "docs/catalog_usage/DOMAIN_SOFT_SCORE_APPLICATIONS_CN.md"
contract = { catalog = { role = "soft_preference", concepts = ["显式偏好成本", "愿望水平"], operations = ["add_preference_function", "compute"], boundaries = ["返回值直接加到最小化目标；正值是成本，奖励须返回负值。", "当前 compute 与 compute_with_tracking 都乘 weight；示例用 weight=1，把强度写在函数中。", "aspiration_levels 读取 metrics.obj_<name>，缺失使用0；不会自动按 Problem 目标名称填入这些指标。"] } }

[[entry]]
key = "bias.rule_based"
title = "RuleBasedBias"
kind = "bias"
import_path = "nsgablack.bias.domain.constraint:RuleBasedBias"
tags = ["bias", "domain", "rule"]
summary = "条件命中后累加显式规则成本；priority 只规定执行顺序，不是首个命中即返回。"
use_when = [
  "需要在不改动硬约束的前提下注入软偏好引导时。 / Need to inject soft preference guidance without changing hard constraints.",
]
minimal_wiring = [
  "from nsgablack.bias import BiasModule, RuleBasedBias",
  "bias_module = BiasModule()",
  "rules = RuleBasedBias(weight=1.0)",
  "rules.add_rule(lambda x, ctx: float(x[0]) < 0.0, lambda x: 0.3 * abs(float(x[0])), priority=10, description='negative-coordinate cost')",
  "bias_module.add(rules)",
  "solver.set_bias_module(bias_module, enable=True)",
]
required_companions = ["bias.module"]
config_keys = ["weight", "rules"]
example_entry = "docs/catalog_usage/DOMAIN_SOFT_SCORE_APPLICATIONS_CN.md"
contract = { catalog = { role = "soft_preference", concepts = ["条件规则", "累加成本"], operations = ["add_rule", "compute"], boundaries = ["按 priority 降序遍历，所有命中规则累加；没有首个命中即返回。", "当前 compute 与 compute_with_tracking 都乘 weight；示例用 weight=1，在 action 中设置系数。", "规则只返回分数，不修改候选、解池成员或 Unit。"] } }

