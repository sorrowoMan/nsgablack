[[entry]]
key = "bias.constraint"
title = "ConstraintBias"
kind = "bias"
import_path = "nsgablack.bias.domain.constraint:ConstraintBias"
tags = ["bias", "constraint", "domain"]
summary = "把显式非负违反函数汇总成软成本；hard 标签只放大惩罚，不替代 Problem 硬约束或准入。"
use_when = [
  "需要在不改动硬约束的前提下注入软偏好引导时。 / Need to inject soft preference guidance without changing hard constraints.",
]
minimal_wiring = [
  "from nsgablack.bias import BiasModule, ConstraintBias",
  "bias_module = BiasModule()",
  "constraint = ConstraintBias(weight=1.0, penalty_factor=3.0)",
  "constraint.add_constraint(lambda x: max(0.0, float(x[0]) - 0.5), constraint_type='hard')",
  "bias_module.add(constraint)",
  "solver.set_bias_module(bias_module, enable=True)",
]
required_companions = ["bias.module"]
config_keys = ["weight", "penalty_factor"]
example_entry = "docs/catalog_usage/DOMAIN_SOFT_SCORE_APPLICATIONS_CN.md"
contract = { catalog = { role = "soft_preference", concepts = ["软约束成本", "非负违反函数"], operations = ["add_constraint", "compute"], boundaries = ["constraint_type='hard' 只乘 penalty_factor，不改 raw_violations 或硬接纳。", "当前 compute 与 compute_with_tracking 都乘 weight；示例用 weight=1，在违反函数或 penalty_factor 中设置系数。"] } }

