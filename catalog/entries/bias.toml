# Canonical bias catalog shard.

[[entry]]
key = "tool.unit_view"
title = "UnitView"
kind = "tool"
import_path = "nsgablack.units:UnitView"
tags = ["unit", "preference", "identity", "readonly"]
summary = "按实例路径、Unit 身份和 revision 交付脱离只读视图；PopulationView 提供成员能力。"
use_when = ["比较结构或让偏好读取明确的算法结构时。"]
minimal_wiring = [
  "import numpy as np",
  "from nsgablack.units import PopulationUnit, UnitBinding",
  "from nsgablack.representation import PopulationUnitBuilder",
  "from nsgablack.units.views import PopulationView",
  "from nsgablack.bias import PreferenceQuery, PopulationDiversityPreference",
  "unit = PopulationUnit('reference', population=np.array([[0., 0.], [1., 1.]]))",
  "view = PopulationView.capture(unit, UnitBinding(PopulationUnitBuilder()), owner_path=('reference',))",
  "score = PopulationDiversityPreference().evaluate(PreferenceQuery('unit', unit=view))",
  "print(score.value, score.direction)",
]
required_companions = ["Adapter-owned Unit and UnitBinding"]
config_keys = ["owner_path", "unit_id", "schema", "revision"]
example_entry = "docs/catalog_usage/NSGABLACK_COMPONENT_USAGE_CN.md"

[[entry]]
key = "tool.preference_query"
title = "PreferenceQuery"
kind = "tool"
import_path = "nsgablack.bias:PreferenceQuery"
tags = ["unit", "bias", "comparison", "contract"]
summary = "显式区分 candidate、candidate_in_unit、unit、unit_transition 四种评价范围。"
use_when = ["由 Adapter 明确消费候选、结构或结构变化的偏好时。"]
minimal_wiring = ["from nsgablack.bias import PreferenceQuery", "query = PreferenceQuery('unit', unit=view)"]
required_companions = ["UnitView for Unit scopes"]
config_keys = ["scope", "candidate", "candidate_token", "unit", "proposed_unit"]
example_entry = "docs/catalog_usage/NSGABLACK_COMPONENT_USAGE_CN.md"

