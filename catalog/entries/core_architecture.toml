[[entry]]
key = "tool.population_unit"
title = "PopulationUnit"
kind = "tool"
import_path = "nsgablack.units:PopulationUnit"
tags = ["core", "unit"]
summary = "种群候选、反馈、token 与扩展成员字段的单一结构；Adapter 选择成员，Unit 原子维护对齐。"
companions = ["tool.unit_binding", "tool.population_change", "tool.unit_feature", "repr.unit_population"]
context_requires = []
context_provides = []
context_mutates = []
context_cache = []
use_when = ["种群扩展字段", "PopulationUnit", "自定义种群", "成员对齐"]
minimal_wiring = [
  "import numpy as np",
  "from nsgablack.units import PopulationUnit, UnitFeature, FeatureUnit",
  "unit = PopulationUnit('demo', population=np.array([[0., 1.], [1., 0.]]))",
  "center = UnitFeature('center', ('population',), lambda data: data['population'].mean(axis=0))",
  "assert isinstance(unit, FeatureUnit)",
  "value = unit.feature(center)",
  "print(value)",
]
required_companions = []
config_keys = ["unit_id", "population", "objectives", "violations", "candidate_tokens", "feedback_population_revision", "feedback_field_revisions"]
example_entry = "examples/cases/assembly_workbench/cases/hybrid_search/run_solver.py"
contract = { catalog = { role = "unit", concepts = ["种群扩展字段", "PopulationUnit", "自定义种群", "成员对齐"], operations = ["initialize_population", "apply_selection", "clear_population", "attach_feedback", "replace_evaluated_rows", "require_current_feedback", "on_members_changed"], boundaries = ["apply_selection 执行 Adapter 给出的索引，不定义生存策略。", "新增行字段须声明 member_fields 并维护；Adapter 不猜测未知字段。"] } }

