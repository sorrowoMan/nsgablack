[[entry]]
key = "tool.feature_unit"
title = "FeatureUnit"
kind = "tool"
import_path = "nsgablack.units:FeatureUnit"
tags = ["unit", "feature", "readonly", "cache"]
summary = "Unit 的按需派生特征能力：按实例隔离、校验依赖内容、只读结果、缓存不进入 checkpoint。"
use_when = ["使用或扩展内置 Unit 的派生特征维护能力时。"]
minimal_wiring = ["value = unit.feature(feature)", "fresh = unit.feature(feature, cache=False)", "unit.clear_features()"]
required_companions = ["UnitFeature", "explicit Unit data fields"]
config_keys = []
example_entry = "docs/catalog_usage/NSGABLACK_COMPONENT_USAGE_CN.md"
companions = ["tool.population_unit", "tool.unit_feature", "tool.unit_binding"]
contract = { catalog = { role = "unit_feature_base", concepts = ["Unit派生特征", "增量特征", "特征失效"], operations = ["feature", "clear_features"], boundaries = ["只读派生缓存不是另一份权威成员；缓存不进入 checkpoint。"] } }
