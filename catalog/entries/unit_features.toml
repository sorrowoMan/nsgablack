# Derived algorithm features; both catalog profiles expose the same core APIs.
[[entry]]
key = "tool.population_change"
title = "PopulationChange"
kind = "tool"
import_path = "nsgablack.units:PopulationChange"
tags = ["unit", "population", "members", "provenance"]
summary = "成员操作的明确来源映射：Adapter 决策，Unit 对齐候选/反馈/token 并维护自定义行字段。"
use_when = ["自定义种群成员字段，需要随选择或替换维护时。"]
minimal_wiring = [
  "from dataclasses import dataclass, field",
  "import numpy as np",
  "from nsgablack.units import PopulationUnit",
  "@dataclass",
  "class AgePopulation(PopulationUnit):",
  "    age: object = field(default=None)",
  "    member_fields = ('age',)",
  "    def on_members_changed(self, change):",
  "        return {'age': np.array([0 if i is None else self.age[i]",
  "            for i in change.previous_member_indices])}",
]
required_companions = ["tool.population_unit", "tool.unit_binding"]
config_keys = ["operation", "previous_count", "incoming_count", "previous_member_indices", "incoming_member_indices"]
example_entry = "docs/catalog_usage/NSGABLACK_COMPONENT_USAGE_CN.md"
companions = ["tool.population_unit", "tool.unit_binding"]
contract = { catalog = { role = "member_change", concepts = ["种群扩展字段", "成员变化传播", "成员对齐", "新增Unit字段"], operations = [], boundaries = ["Adapter 决定成员，Unit 按来源映射维护声明字段。", "只读 on_members_changed 不执行选择、评估或修改原 Unit。"] } }

[[entry]]
key = "tool.unit_input_spec"
title = "UnitInputSpec"
kind = "tool"
import_path = "nsgablack.units:UnitInputSpec"
tags = ["unit", "operator", "dependency", "readonly"]
summary = "变异算子显式声明 Unit 字段与特征，由实际 Adapter 提供脱离只读输入。"
use_when = ["变异需要读取种群、区域或其他 Unit 信息时。"]
minimal_wiring = ["from nsgablack.units import UnitInputSpec", "unit_inputs = UnitInputSpec(fields=('population',))", "# Define mutate(candidate, context, *, unit); read unit.fields['population']"]
required_companions = ["UnitInputs", "owning Adapter"]
config_keys = ["fields", "features", "feedback_view", "schema"]
example_entry = "docs/catalog_usage/NSGABLACK_COMPONENT_USAGE_CN.md"
companions = ["tool.population_unit", "tool.unit_binding"]
contract = { catalog = { role = "unit_dependency", concepts = ["Unit依赖", "种群扩展字段", "算子读取Unit"], operations = [], boundaries = ["依赖由实际叶 Adapter 捕获；共享 context 不用于猜测 Unit 所有者。"] } }

[[entry]]
key = "tool.unit_inputs"
title = "UnitInputs"
kind = "tool"
import_path = "nsgablack.units:UnitInputs"
tags = ["unit", "operator", "readonly"]
summary = "调用局部的只读 Unit 字段/特征投影，携带 unit_id、schema 和依赖版本。"
use_when = ["读取算子声明的 Unit 依赖，不暴露可写 Unit 或 Solver 时。"]
minimal_wiring = [
  "from nsgablack.units import UnitInputSpec",
  "class TowardCenter:",
  "    stateless = True",
  "    unit_inputs = UnitInputSpec(fields=('population',))",
  "    def checkpoint_identity(self): return {'name': 'toward_center', 'version': 1}",
  "    def mutate(self, candidate, context, *, unit):",
  "        return candidate + 0.1 * (unit.fields['population'].mean(axis=0) - candidate)",
  "adapter.set_mutator(TowardCenter())",
]
required_companions = ["UnitInputSpec"]
config_keys = ["unit_id", "schema", "revision", "fields", "features"]
example_entry = "docs/catalog_usage/NSGABLACK_COMPONENT_USAGE_CN.md"
companions = ["tool.population_unit", "tool.unit_binding"]
contract = { catalog = { role = "unit_dependency", concepts = ["Unit依赖", "种群扩展字段", "算子读取Unit"], operations = [], boundaries = ["依赖由实际叶 Adapter 捕获；共享 context 不用于猜测 Unit 所有者。"] } }

[[entry]]
key = "tool.unit_feature"
title = "UnitFeature"
kind = "tool"
import_path = "nsgablack.units:UnitFeature"
tags = ["unit", "feature", "dependency", "cache"]
summary = "候选/集合的算法特征声明：显式字段依赖、raw/selection 反馈视图和可选增量更新。"
use_when = ["给 Unit 添加按依赖变化维护的派生特征时。"]
