# Canonical tool catalog shard.

[[entry]]
key = "tool.strategy_task"
title = "StrategyTask"
kind = "tool"
import_path = "nsgablack.adapters:StrategyTask"
tags = ["composition", "contract", "strategy", "tool"]
summary = "多策略子任务：实例路径、阶段、原提案预算和局部区域/种子。"
use_when = ["子 Adapter 需要读取组合器分配的任务时。"]
minimal_wiring = ["from nsgablack.adapters import StrategyTask", "task = StrategyTask.from_context(context)"]
required_companions = ["adapter.multi_strategy"]
config_keys = ["owner_path", "task_id", "phase", "budget", "region_id", "seeds"]

[[entry]]
key = "tool.strategy_origin"
title = "StrategyOrigin"
kind = "tool"
import_path = "nsgablack.adapters:StrategyOrigin"
tags = ["composition", "contract", "provenance", "tool"]
summary = "候选从外到内的策略来源，与 CandidateBatch/token 一起保存和筛选。"
use_when = ["查询数值相同候选各自的角色、实例和提案行来源时。"]
minimal_wiring = ["from nsgablack.adapters import StrategyOrigin", "route = StrategyOrigin.from_candidate(batch.semantic_states[index])"]
required_companions = ["adapter.multi_strategy"]
config_keys = ["owner_path", "task_id", "proposal_index"]

[[entry]]
key = "tool.runtime_participant"
title = "RuntimeParticipant"
kind = "tool"
import_path = "blackbase.runtime:RuntimeParticipant"
tags = ["runtime-contract", "authority", "tool"]
summary = "通用步骤事务参与者；局部快照、恢复、子参与者与提交后清理。"
use_when = ["新增有状态运行组件时。"]
minimal_wiring = ["from blackbase.runtime import RuntimeParticipant", "solver.register_state_participant(component)"]
required_companions = ["(none)"]
config_keys = ["snapshot_step_state", "restore_step_state", "commit_step_state", "step_transaction_children"]

[[entry]]
key = "tool.representation_capabilities"
title = "RepresentationCapabilities"
kind = "tool"
import_path = "blackbase.representation:RepresentationCapabilities"
tags = ["runtime-contract", "authority", "tool"]
summary = "候选管线显式操作能力声明。"
use_when = ["组装 codec、搜索或 repair 的任意子集时。"]
minimal_wiring = ["from blackbase.representation import RepresentationCapabilities", "RepresentationCapabilities(frozenset({'init', 'repair'}))"]
required_companions = ["(none)"]
config_keys = ["operations", "codec_deterministic", "repair_idempotent"]

[[entry]]
key = "tool.participation_contract"
title = "ParticipationContract"
kind = "tool"
import_path = "blackbase.participation:ParticipationContract"
tags = ["runtime-contract", "authority", "tool"]
summary = "Plugin 与 Controller 的建议、决定和否决域。"
use_when = ["组件接管评估或参与严格结果发布时。"]
minimal_wiring = ["from blackbase.participation import ParticipationContract", "ParticipationContract(vetoes=('finalization',))"]
required_companions = ["(none)"]
config_keys = ["advises", "decides", "vetoes"]

[[entry]]
key = "tool.preference_delta"
title = "PreferenceDelta"
kind = "tool"
import_path = "blackbase.preferences:PreferenceDelta"
tags = ["runtime-contract", "authority", "tool"]
summary = "保留原始反馈的偏好增量值。"
