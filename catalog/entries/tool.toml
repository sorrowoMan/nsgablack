[[entry]]
key = "tool.finalization_hooks"
title = "FinalizationHooks"
kind = "tool"
import_path = "blackbase.runtime:FinalizationHooks"
tags = ["runtime-contract", "authority", "tool"]
summary = "结果准备和事务发布的显式注册入口。"
