use_when = ["连续单目标无约束搜索，需要按整批排名自适应搜索分布时。"]
minimal_wiring = ["from nsgablack.adapters import CMAESAdapter", "solver.set_adapter(CMAESAdapter([0.0, 0.0], sigma=0.5))"]
example_entry = "examples/cases/algorithm_semantics/cases/cmaes_distribution/run_solver.py"
companions = ["tool.cma_unit", "tool.cma_sampler", "tool.cma_ranking", "tool.cma_update", "tool.unit_binding"]
contract = { catalog = { role = "adapter", concepts = ["CMA-ES", "搜索分布", "替换采样器", "整批更新"], operations = [], boundaries = ["正权重无约束单目标完整协方差；不得静默缩小 lambda。", "改变候选的 repair 在送评前拒绝；残缺 cohort 保留成本后报错。", "未声明 PoolTask initialize/refine/compete；运行提案仍走统一解池。"] } }

