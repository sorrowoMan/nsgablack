contract = { catalog = { role = "adapter", concepts = ["MAP-Elites", "质量多样性", "按行为保留精英", "替换描述符", "格子档案"], operations = [], boundaries = ["Unit 唯一拥有冠军；Pool 仅发布精确引用视图。", "描述符来自最终送评候选；硬接纳和档案留存分开。", "首版 emitter 无完整 cohort 反馈接口，不宣称支持 CMA emitter。"] } }

