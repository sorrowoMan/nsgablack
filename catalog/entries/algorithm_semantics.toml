# Full algorithms and their precise limits; algorithm-inspired biases are separate.

[[entry]]
key = "adapter.bayesian_optimization"
title = "BayesianOptimizationAdapter"
kind = "adapter"
import_path = "nsgablack.adapters:BayesianOptimizationAdapter"
tags = ["adapter", "core", "bayesian", "surrogate", "observations"]
summary = "同步单目标贝叶斯优化：固定RBF后验、LCB与网格提案组件；消费真实完整Event，模型观测与成员分离，支持可传输证据闭包恢复。首版不承诺异步或联合q-batch。"
config_keys = ["config", "model", "acquisition", "optimizer", "unit_binding", "name", "priority"]
use_when = ["需要明确区分真实观测、预测与评估价值，并以模型提出昂贵真实评估的候选时。"]
minimal_wiring = ["from nsgablack.adapters import BayesianOptimizationAdapter", "solver.set_adapter(BayesianOptimizationAdapter())"]
example_entry = "examples/cases/algorithm_semantics/cases/synchronous_bo/run_solver.py"
companions = ["tool.bo_unit", "tool.bo_model", "tool.bo_acquisition", "tool.bo_acquisition_optimizer", "tool.unit_binding"]
contract = { catalog = { role = "adapter", concepts = ["贝叶斯引导", "贝叶斯优化", "替换采集函数", "真实观测与成员分离"], operations = ["synchronize_observations"], boundaries = ["仅同步单目标；首版仅无 EvaluationProvider/评估决定插件的真实 Problem 路径。", "固定参数模型从证据重建；采集/优化器首版须 stateless。", "不支持真实异步 pending、联合 q-batch、随机超参数训练或完整约束 BO。"] } }

[[entry]]
key = "adapter.cmaes"
title = "CMAESAdapter"
kind = "adapter"
import_path = "nsgablack.adapters:CMAESAdapter"
tags = ["adapter", "core", "cma-es", "covariance", "cohort"]
summary = "正权重完整协方差CMA-ES：采样、排名、分布更新分别装配；保存演化路径和完整cohort，严格拒绝改变候选的repair及残缺更新。"
