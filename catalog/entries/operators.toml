minimal_wiring = ["adapter.set_mutator(mutator)", "adapter.set_parent_selector(selector)", "# Components declare checkpoint_identity() and stateless=True or get_state()/set_state()."]
required_companions = ["(none)"]
config_keys = ["component", "method"]
example_entry = "docs/architecture/ADAPTER_OPERATION_BOUNDARIES_CN.md"

[[entry]]
key = "tool.parent_selection_request"
title = "ParentSelectionRequest"
kind = "tool"
import_path = "nsgablack.adapters.parent_selection:ParentSelectionRequest"
tags = ["core", "operator", "selection", "solution-pool", "readonly"]
summary = "父代选择输入：members Pool保留真实成员槽位与声明字段，可返回其筛选或有放回抽样结果；旧引用返回要求成员槽位无歧义。完整change通过parent_pool读取对应属性。"
use_when = ["编写返回 SolutionRef 序列的父代选择器；不把本地整数索引当成跨池候选。"]
minimal_wiring = [
  "from nsgablack.adapters import NSGA2Adapter",
  "class FirstParents:",
  "    stateless = True",
  "    def checkpoint_identity(self): return {'name': 'first_parents', 'version': 1}",
  "    def select(self, request, *, pool, rng):",
  "        return request.members.sample(request.count, rng=rng, replace=True)",
  "adapter = NSGA2Adapter(parent_selector=FirstParents())",
]
required_companions = ["adapter.nsga2", "tool.solution_pool"]
config_keys = ["population_refs", "rank", "crowding", "count", "context", "members"]
example_entry = "docs/architecture/ADAPTER_OPERATOR_BINDINGS_CN.md"

[[entry]]
key = "tool.mixed_pool_parent_selector"
title = "MixedPoolParentSelector"
kind = "tool"
import_path = "nsgablack.adapters.parent_selection:MixedPoolParentSelector"
tags = ["core", "operator", "selection", "solution-pool", "nsga2"]
summary = "从本种群 rank/crowding 锦标赛与已发布具名子池混合抽取父代，返回准确引用；不修改环境选择或创建精英池。"
use_when = ["希望只替换 NSGA-II 的父代来源，保留交叉、变异、评估和生存选择时。"]
minimal_wiring = ["from nsgablack.adapters import MixedPoolParentSelector, NSGA2Adapter", "adapter = NSGA2Adapter()", "adapter.set_parent_selector(MixedPoolParentSelector('elite', pool_fraction=0.5))", "# Publish a nonempty named 'elite' pool before the first parent-selection call."]
required_companions = ["adapter.nsga2", "tool.solution_pool"]
config_keys = ["pool_name", "pool_fraction"]
example_entry = "docs/architecture/ADAPTER_OPERATOR_BINDINGS_CN.md"

[[entry]]
key = "repr.gaussian_mutation"
title = "GaussianMutation"
kind = "representation"
import_path = "nsgablack.representation.continuous:GaussianMutation"
tags = ["core", "continuous", "mutation", "operator", "checkpoint"]
summary = "高斯变异：可直接绑定明确消费 mutator 的 Adapter，或接既有 Pipeline；DE 的直属变化在差分 trial 后执行，随机状态随实际所有者恢复。"
use_when = ["需要为 NSGA、DE、MOEA/D 或轨迹算法独立指定可恢复变异；动态邻域优先考虑 ContextGaussianMutation。"]
minimal_wiring = ["from nsgablack.adapters import NSGA2Adapter", "from nsgablack.representation.continuous import GaussianMutation", "adapter = NSGA2Adapter()", "adapter.set_mutator(GaussianMutation(sigma=0.1))", "# Do not share this stateful instance with another Adapter or the pipeline."]
required_companions = ["(none)"]
config_keys = ["sigma", "low", "high"]
example_entry = "docs/architecture/ADAPTER_OPERATOR_BINDINGS_CN.md"

[[entry]]
key = "tool.selection_request"
title = "SelectionRequest"
kind = "tool"
import_path = "nsgablack.adapters.selection:SelectionRequest"
tags = ["core", "operator", "selection", "readonly", "purpose"]
summary = "评估后只读行选择请求：survivor 保留成员、replacement 比较槽位、candidate 选本批候选、proposal_order 重排本批；不承担父代引用选择或硬接纳。"
use_when = ["编写明确消费算法比较视图与参数的 selector，而不直接修改 Adapter/Unit；MOEA/D 必须使用该方向提供的分数。"]
minimal_wiring = [
  "from nsgablack.adapters import DifferentialEvolutionAdapter",
  "class FirstOffered:",
  "    stateless = True",
  "    def checkpoint_identity(self): return {'name': 'first_offered', 'version': 1}",
  "    def select(self, request, *, rng):",
  "        if request.purpose != 'replacement': raise ValueError('replacement only')",
  "        return list(range(request.count))",
  "adapter = DifferentialEvolutionAdapter(selector=FirstOffered())",
]
required_companions = ["(none)"]
config_keys = ["purpose", "candidates", "objectives", "violations", "count", "scores", "parameters", "context", "pool"]
example_entry = "docs/architecture/ADAPTER_OPERATION_BOUNDARIES_CN.md"

[[entry]]
key = "tool.feasibility_first_selection"
title = "FeasibilityFirstSelection"
kind = "tool"
import_path = "nsgablack.adapters.selection:FeasibilityFirstSelection"
tags = ["core", "operator", "selection", "feasibility", "stateless"]
summary = "显式可行性优先行选择：使用算法提供的 scores 或指定目标；不自动装配，也不等价于 NSGA Pareto 选择、Metropolis 或硬可行性接纳。"
use_when = ["确实希望覆盖已声明选择位置的策略时；首先明确该 Adapter 请求的 purpose 与 scores 含义。"]
minimal_wiring = ["from nsgablack.adapters import DifferentialEvolutionAdapter, FeasibilityFirstSelection", "adapter = DifferentialEvolutionAdapter(selector=FeasibilityFirstSelection())", "# Explicitly overrides target/trial replacement; omit selector to retain the native policy."]
required_companions = ["tool.selection_request"]
config_keys = ["objective_index", "constraint_tolerance"]
example_entry = "docs/architecture/ADAPTER_OPERATION_BOUNDARIES_CN.md"
