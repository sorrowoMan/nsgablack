[[example]]
id = "structured-local-application-weighted-region"
title = "固定权衡的两目标信赖域 · 完整Case及换方向变体"
component_keys = ["adapter.trust_region_mo_dfo", "repr.unit_region"]
kind = "documentation"
working_directory = "nsgablack"
summary = "把原单目标两步演示显式换成两目标Problem、固定权重TR工厂、RegionUnitBinding、正式结果观察和12步上限；保留Project/L0。"
inputs = ["完整trust_region_mo Project副本；当前NumPy/nsgablack/blackbase；候选2维、raw双目标，固定权重(.8,.2)。"]
steps = ["保存本节完整Problem与工厂，按共用节保存观察器、薄builder、Pipeline函数。", "原default组运行唯一Case；变体明确改为普通Dirichlet方向，任务冻结与外部投影语义另说明。"]
dependencies = ["当前NumPy、nsgablack、blackbase；无模型API。"]
expected_outputs = ["本次Case results/local_search.json中精确best refs、raw两列、center/radius/weights及本地current/best选择；区分本地加权与Solver incumbent聚合，未执行本教程。"]
sources = [{ path = "nsgablack/docs/catalog_usage/STRUCTURED_LOCAL_SEARCH_APPLICATIONS_CN.md", section = "adapter.trust_region_mo_dfo" }, { path = "nsgablack/docs/catalog_usage/STRUCTURED_LOCAL_SEARCH_APPLICATIONS_CN.md", section = "structured.local.host" }]

