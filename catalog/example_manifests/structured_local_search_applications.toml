expected_outputs = ["本次local_search.json的6维候选/raw单目标、6×2 basis、实际basis_method、最多32条sample_refs、center/radius及精确已评估结果；没有执行数值几何或恢复验证。"]
sources = [{ path = "nsgablack/docs/catalog_usage/STRUCTURED_LOCAL_SEARCH_APPLICATIONS_CN.md", section = "adapter.trust_region_subspace" }, { path = "nsgablack/docs/catalog_usage/STRUCTURED_LOCAL_SEARCH_APPLICATIONS_CN.md", section = "structured.local.host" }]

[[example]]
id = "structured-local-application-mas"
title = "近邻模型先筛候选，再真实送评 · MAS完整Case及无代理变体"
component_keys = ["adapter.mas", "repr.unit_model_search"]
kind = "documentation"
working_directory = "nsgablack"
summary = "实际绑定ModelSearchUnitBuilder与五近邻模型，区分内部候选预测、真实求值、当前中心与历史最好；训练历史按精确引用有界保存。"
inputs = ["完整mas_search Project副本；二维偏移平方Problem；batch6、探索比例.5、拟合阈值5、窗口32；CPU scikit-learn依赖。"]
steps = ["保存本节完整Problem/Adapter工厂以及共用正式薄builder/Pipeline/报告，将原1步演示换成12步上限。", "变体只关闭代理；不把模型预测或关闭后的历史统计冒充真实求值。"]
dependencies = ["当前NumPy、nsgablack、blackbase、框架已声明的scikit-learn；不下载模型、不调用付费API。"]
expected_outputs = ["本次local_search.json的精确best引用/raw反馈、current与best、history_count/history_refs、surrogate_present/fitted与接纳来源阶段；未运行算法或训练，代理失败和回退不伪称成功。"]
sources = [{ path = "nsgablack/docs/catalog_usage/STRUCTURED_LOCAL_SEARCH_APPLICATIONS_CN.md", section = "adapter.mas" }, { path = "nsgablack/docs/catalog_usage/STRUCTURED_LOCAL_SEARCH_APPLICATIONS_CN.md", section = "structured.local.host" }]
