[[example]]
id = "structured-local-application-subspace"
title = "六维候选、二维区域与本算法参考样本 · 完整子空间Case"
component_keys = ["adapter.trust_region_subspace"]
kind = "documentation"
working_directory = "nsgablack"
summary = "显式绑定RegionUnitBuilder和PCA/随机基调度，参考样本只来自本任务实际接纳版本；说明沿射线边界裁剪与子空间修复检查。"
inputs = ["完整trust_region_subspace Project副本；六维各向异性平方Problem，子空间秩2、最少样本8、有界窗口32。"]
steps = ["保存完整Problem/工厂和共用builder/Pipeline/观察器，保留原Project L0/default。", "变体每轮刷新随机基，区分配置方法与实际basis_method。"]
