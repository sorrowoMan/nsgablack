[[example]]
id = "core-curation-maintenance-application"
title = "说明发布器的只读缓存接线与离线缺口规划"
component_keys = ["tool.catalog_curate"]
kind = "documentation"
working_directory = "nsgablack"
summary = "实际调用curate_packets缓存分支，注入只读真实导出适配器和拒绝生成器；新摘要失配先停止，不伪造AI说明或审核。"
inputs = ["已有来源packets/index、真实AI记录导出列表与模型身份；变体只需examples索引。"]
steps = ["先核对真实缓存，再进行幂等统计；新资料通过源码文档/manifest维护并独立重建索引。"]
dependencies = ["当前nsgablack，无模型API或数据库连接。"]
expected_outputs = ["匹配时cached1/generated0，失配报错；离线变体生成资料缺口JSON，不增加AI审核计数。"]
sources = [{path="nsgablack/docs/catalog_usage/RUNTIME_UTILITY_APPLICATIONS_CN.md", section="tool.catalog_curate"}]
