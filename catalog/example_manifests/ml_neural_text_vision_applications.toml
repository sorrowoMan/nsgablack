[[example]]
id="ml-neural-text-classification-lm"
title="训练专属词表与两种文本监督 · 正式小Transformer Case"
component_keys=["mlblack.numericizer.vocabulary_tokenizer", "mlblack.pipeline.tokenized_text_dataset_builder", "mlblack.problem.tiny_transformer_classification", "mlblack.problem.tiny_transformer_language_model"]
kind="documentation"
working_directory="mlblack"
summary="从独立训练文本fit词表、Builder只处理训练记录，再同词表变换验证；完整Head/Problem/Provider/Artifact接线，真实切换分类与下一token目标。"
inputs=["完整tiny_transformer_smoke副本、原L0与单Case组；三仓、NumPy和CPU Torch。", "四条4-token训练句、两条独立验证；无padding/预训练/下载。"]
steps=["保存完整数据、带tokenizer Artifact hook的Problem、薄builder与Project结果入口；验证不进入词表fit。", "变体切换LM Head/Problem及3token模型输入，数据y标签不再用于LM损失。"]
dependencies=["三仓、NumPy、PyTorch；无需transformers或模型API。"]
expected_outputs=["正式反馈分类valid.log_loss或LM valid.cross_entropy及对应指标、模型引用；完整词表随typed Artifact metadata保存。", "不把Builder描述当完整词表，也不假定padding mask、assistant-only监督或生成质量已支持/验证。"]
sources=[{path="nsgablack/docs/catalog_usage/ML_NEURAL_TEXT_VISION_APPLICATIONS_CN.md",section="neural.text"},{path="nsgablack/docs/catalog_usage/ML_NEURAL_TEXT_VISION_APPLICATIONS_CN.md",section="neural.text.wiring"}]

