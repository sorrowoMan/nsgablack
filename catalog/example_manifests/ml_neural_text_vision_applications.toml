dependencies=["当前三仓、NumPy、PyTorch，无图像下载/外部模型账号。"]
expected_outputs=["正式原始triplet目标、正负距离/retrieval_accuracy诊断、模型引用与本次JSON；accuracy只计正负排序，没有验证集时不宣称检索泛化。"]
