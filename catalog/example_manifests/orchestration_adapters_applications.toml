[[example]]
id = "orchestration-roles-events"
title = "角色与事件组合 · 完整Case、配额和真实事件审计"
component_keys = ["adapter.role", "adapter.multi_role_controller", "adapter.async_event_driven", "plugin.async_event_hub"]
kind = "documentation"
working_directory = "nsgablack"
summary = "实际RoleAdapter/Controller与Async事件队列两种装配，含规则路由变体，明确Hub仅观察副本、无隐式GA到VNS池交接。"
inputs = ["完整catalog_recipes Project，Plateau二维Problem、Pipeline、Gaussian叶变化、NSGA/VNS与正式L0。"]
steps = ["保存完整host与adapter/composition.py，root/owner/extras实际装配。", "独立切换本地cap或event_cases规则，核对语义差异。"]
dependencies = ["当前nsgablack、blackbase与NumPy；无后台线程或外部服务。"]
expected_outputs = ["orchestration.json真实owner成员、运行切片、Hub提交/非提交事件计数；没有执行证明。"]
sources = [{ path = "nsgablack/docs/catalog_usage/ORCHESTRATION_ADAPTER_APPLICATIONS_CN.md", section = "orchestration.roles_events" }, { path = "nsgablack/docs/catalog_usage/ORCHESTRATION_ADAPTER_APPLICATIONS_CN.md", section = "orchestration.host" }]

[[example]]
id = "orchestration-elite-injection"
title = "精英派生Adapter · archive与真实成员分开观察"
component_keys = ["adapter.elite_retention"]
kind = "documentation"
working_directory = "nsgablack"
summary = "完整NSGA Case在正式送评前替换精英派生候选，说明actual mutation来源、有限archive、身份和事务。"
inputs = ["完整host、可替换普通提案的NSGA2、精确成员引用、Archive wrapper和真实mutator。"]
steps = ["实际构造EliteRetentionAdapter作为root，保留inner对象给报告。", "ratio=0隔离替换效果，archive仍可观察。"]
dependencies = ["当前nsgablack、blackbase与NumPy。"]
expected_outputs = ["orchestration.json的archive和owner成员；新派生走repair/evaluate/admission，没有复制父分数或发布未评估点。"]
sources = [{ path = "nsgablack/docs/catalog_usage/ORCHESTRATION_ADAPTER_APPLICATIONS_CN.md", section = "orchestration.elite" }, { path = "nsgablack/docs/catalog_usage/ORCHESTRATION_ADAPTER_APPLICATIONS_CN.md", section = "orchestration.host" }]

[[example]]
id = "orchestration-elite-plugin-migration"
title = "旧精英Plugin未装配 · 迁移到事务型Adapter"
component_keys = ["plugin.elite"]
kind = "documentation"
