steps = ["撤下旧Plugin，按对应Config参数显式包住inner。", "历史条数变体仍使用同一个正式Adapter。"]
dependencies = ["当前框架栈。"]
expected_outputs = ["迁移边界与替代Case报告；不计为旧Plugin active运行用法。"]
