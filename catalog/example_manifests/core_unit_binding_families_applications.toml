[[example]]
id = "unit-binding-vns-candidate-neighborhood"
title = "VNS双槽 · 候选本体与邻域尺度分别构建/恢复"
component_keys = ["repr.unit_candidate", "repr.unit_neighborhood"]
kind = "documentation"
working_directory = "nsgablack"
summary = "完整单纯形VNS Case保留Problem/Pipeline/报告，在规范薄入口明确绑定Candidate与Neighborhood两个真实槽位，构造检查不创建运行结构。"
