[[example]]
id = "bias-migration-convergence-family"
title = "六个旧收敛或Levy类未装配 · 明确Unit成本与真实变化"
component_keys = ["bias.convergence", "bias.convergence_adaptive", "bias.convergence_precision", "bias.convergence_late_stage", "bias.convergence_multi_stage", "bias.levy"]
kind = "documentation"
usage_status = "migration_reference"
working_directory = "nsgablack"
summary = "逐类说明阶段常量、缺少实例/指标来源、符号与未生成Levy随机步的边界；用有明确PopulationView的中心距离偏好说明可装配替代，实际变化仍由算子负责。"
inputs = ["完整bias_gallery/Unit偏好主例、二维Sphere和正式Project L0；不提供全局population数组。"]
steps = ["定义完整CenterDistancePreference，只替换真实Unit桥接中的叶评分器，保留Report的独立新颖性观察。", "变体改变实际GaussianMutation尺度，明确不是Levy分布。"]
dependencies = ["当前nsgablack、blackbase、NumPy。"]
expected_outputs = ["中心距离形成正最小化成本，raw不变；旧六类未启用，阶段调度/自适应/Levy采样未宣称实现。"]
sources = [{ path = "nsgablack/docs/catalog_usage/BIAS_ALGORITHM_MIGRATIONS_CN.md", section = "migration.bias.convergence" }, { path = "nsgablack/docs/catalog_usage/POPULATION_PREFERENCE_APPLICATIONS_CN.md", section = "bias.unit_preference" }]

[[example]]
id = "bias-migration-local-search-family"
title = "六个旧局部搜索Bias未装配 · 正式有限差分任务替代"
component_keys = ["bias.local_gd", "bias.local_newton", "bias.local_line_search", "bias.local_trust_region", "bias.local_nelder_mead", "bias.local_quasi_newton"]
kind = "documentation"
usage_status = "migration_reference"
working_directory = "nsgablack"
summary = "指出旧compute/apply不对接与评分内隐藏再评估；用已有标准Case有限差分精修保留预算、候选身份和结果交还，明确不等价于Newton/Armijo/单纯形/BFGS。"
inputs = ["完整solution_pool Project的moead_refinement Case及配套配置/报告/薄builder；当前框架栈和NumPy。"]
steps = ["按配套完整教程启用finite_difference分支；起点、探针、下降点各自送评。", "变体从4方向改为该实例全部方向，仍不启用旧类。"]
dependencies = ["当前nsgablack、blackbase、NumPy；无需解析梯度。"]
expected_outputs = ["本次finite_difference.json的请求最终选择、raw双目标、方向成员与接纳历史分别解释；不是旧局部类的执行证明。"]
sources = [{ path = "nsgablack/docs/catalog_usage/BIAS_ALGORITHM_MIGRATIONS_CN.md", section = "migration.bias.local_search" }, { path = "nsgablack/docs/catalog_usage/FINITE_DIFFERENCE_APPLICATION_CN.md", section = "adapter.gradient_descent" }]

[[example]]
id = "bias-migration-bayesian-family"
