[[example]]
id = "bias-migration-diversity-family"
title = "五个旧多样性类未装配 · 显式Unit参考的具体迁移"
component_keys = ["bias.diversity", "bias.diversity_adaptive", "bias.diversity_crowding", "bias.diversity_niche", "bias.diversity_sharing"]
kind = "documentation"
usage_status = "migration_reference"
working_directory = "nsgablack"
summary = "逐类说明旧population依赖、符号、双加权、有限性及生态位更新缺口；实际替代为正式UnitPreferenceBias+PopulationDiversityPreference，不声称旧算法已修复。"
inputs = ["完整bias_gallery Project副本、当前框架栈/NumPy；配套主例明确实际search实例和OWNER。"]
steps = ["先阅读旧类边界，再按配套完整主例保存正式builder和Report，旧类不挂载。", "变体只观察Unit新颖性，不改选择。"]
dependencies = ["当前nsgablack、blackbase、NumPy；无外部模型。"]
expected_outputs = ["正式population_preference.json中的明确实例/版本/raw与selection；缺失生态位、自适应、sharing等语义不被替代方案冒充。"]
