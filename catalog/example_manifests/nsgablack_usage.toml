[[example]]
id = "usage-adapter-composite"
title = "CompositeAdapter · 两个独立种群共同送评"
component_keys = ["adapter.composite"]
kind = "documentation"
working_directory = "nsgablack"
run_command = "python examples/cases/catalog_recipes/run_project.py"
summary = "在同一个二维平方和问题上运行两个独立NSGA-II种群：wide用较大扰动，narrow用较小扰动。展示提案如何合并、反馈如何返回，以及怎样查看两个分区。"
inputs = ["正式catalog_recipes Project已有二维QuadraticProblem与边界[-2,2]候选管线；每个NSGA-II保持4名成员并提出4个后继。"]
steps = ["先运行catalog_recipes默认composite Case，保留Project发放的ResourceContext。", "需要修改时替换该Case的build_solver.py中的两个NSGA-II实例；最后仍返回同一solver。", "根据终端提交/求值摘要判断运行是否完成；查看各自种群时使用get_population_partitions，不把最后一批送评候选当最终成员。"]
dependencies = ["当前nsgablack与blackbase；NumPy"]
expected_outputs = ["两个独立种群分区child:0:wide/population与child:1:narrow/population，各自保持4名成员；不是一个合并的8成员种群。"]
sources = [
  { path = "nsgablack/docs/catalog_usage/NSGABLACK_COMPONENT_USAGE_CN.md", section = "adapter.composite" },
  { path = "nsgablack/docs/catalog_usage/SEARCH_ASSEMBLY_EXTENSIONS_CN.md", section = "extension.adapter.composite" },
]

