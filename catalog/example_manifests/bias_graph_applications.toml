[[example]]
id = "bias-graph-legacy-scores-migration"
title = "七个旧图评分器未装配 · 编码、符号与节点范围边界"
component_keys = ["bias.graph_connectivity", "bias.graph_sparsity", "bias.graph_degree_distribution", "bias.graph_shortest_path", "bias.graph_max_flow", "bias.graph_coloring", "bias.graph_community"]
kind = "documentation"
usage_status = "migration_reference"
working_directory = "nsgablack"
summary = "逐key明确最小化符号、孤立节点、容量/有向编码与GraphStructure构造器缺口；提供当前可用结构成本Case，不声称等价于流/路径/社区算法。"
inputs = ["当前源码与本书完整正成本图Case；保留真实业务图语义，不用Case补丁绕过旧类。"]
steps = ["不add七旧类，先按精确边位或节点色选择实际替代组件。", "变体把明确边成本写进Problem raw，不在Bias中隐藏另一套算法。"]
dependencies = ["当前框架栈、NumPy；未运行图网络库。"]
expected_outputs = ["准确迁移边界与实际替代Case报告，七旧类不计active或已修复。"]
sources = [{ path = "nsgablack/docs/catalog_usage/BIAS_GRAPH_APPLICATIONS_CN.md", section = "migration.bias.graph_scores" }, { path = "nsgablack/docs/catalog_usage/BIAS_GRAPH_APPLICATIONS_CN.md", section = "bias.graph_tree_constraint" }, { path = "nsgablack/docs/catalog_usage/BIAS_GRAPH_APPLICATIONS_CN.md", section = "graph.edge_scores" }, { path = "nsgablack/docs/catalog_usage/BIAS_GRAPH_APPLICATIONS_CN.md", section = "graph.shared_host" }]

