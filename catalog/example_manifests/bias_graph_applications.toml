[[example]]
id = "bias-graph-edge-constraints"
title = "树、完美匹配与组合验证的实际六位边Case"
component_keys = ["bias.graph_constraint", "bias.graph_tree_constraint", "bias.graph_matching_constraint", "bias.graph_composite_constraint"]
kind = "documentation"
working_directory = "nsgablack"
summary = "完整正式Case实际装配Tree/Matching/Composite及GraphConstraintBias子类，固定六位无向编码，0/50软成本与raw硬门明确分开。"
