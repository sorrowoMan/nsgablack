expected_outputs = ["本次成功结束后看 `results/members.json`：refs、candidates、raw_objectives、raw_violations 行序对应，完整默认预算下应有 12 个二维成员、每行 3 个原始目标。每行目标应符合三个距离定义；文件是本地观察副本，要核对本轮 run_id，不用旧文件证明新运行。Project 的单个 `best_solution/best_objectives` 是 Solver incumbent，有自己的标量比较，不能代替参考方向选出的成员集合或证明前沿覆盖。观察器不调用 Problem，不重抽候选。"]
