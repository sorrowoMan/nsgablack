component_keys = ["repr.integer", "repr.matrix"]
kind = "documentation"
working_directory = "nsgablack"
summary = "完整整数问题、初值、变异和修复接线；二维矩阵来源仍返回扁平六维候选，Problem 明确 reshape，不把矩阵当种群 Unit 或自动产能约束。"
