steps = ["先核对本章列出的所有文件，再从正式Project入口运行。builder先取得DataView，再构造带Head的模型表示、Problem和Adapter；运行中Adapter提出参数候选，表示将UnknownState解释成模型，Problem用数据生成原始反馈，Adapter按自己的规则消费反馈并选择后继，Solver负责接纳、事务提交和逻辑步计数。装配、观察和读取dimension不应提前调用init或构建算法Unit。"]
