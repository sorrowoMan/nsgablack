expected_outputs = ["表示dimension应为6，模型predict_interval(X)返回等长lower/upper，predict(X)是(n_samples,2)。metrics含train.coverage/train.mean_width/train.mean_miss_distance；原始objectives为[width_weight*width+miss_weight*miss,width,miss]，constraints为[target_coverage-coverage]。高斯搜索按首个区间目标比较，仍须同时检查覆盖约束是否满足。 在保留同一次正式Case实例的程序式调用中，solver.fit()/run()返回TrainerResult；从result.best_model读取模型，result.best_feedback读取反馈，result.best_state读取参数，result.report读取ML报告。这里的solver/result是实际运行实例及其返回值，不是装配时凭空预建的对象。默认Project终端摘要不保证打印这些完整对象；不要为了读取它们再次不加区分地运行一次训练。 权威结果：result.best_state/best_model/best_feedback来自Solver权威incumbent，不等于Adapter最后后继或最终成员；局部objective_aggregation不自动配置Solver最终scalarizer。本例未显式配置scalarizer，默认sum三个目标，非仅首项。"]
sources = [{ path = "nsgablack/docs/catalog_usage/ML_COMPONENT_APPLICATIONS_CN.md", section = "mlblack.head.two_model_interval" }]

