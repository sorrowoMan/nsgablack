[[example]]
id = "application-mlblack.data_view.numeric"
title = "数值数据、标签与训练验证区域 · 基础应用与变体"
component_keys = ["mlblack.data_view.numeric"]
kind = "documentation"
working_directory = "nsgablack"
summary = "把二维特征和逐行标签交给学习Problem；本例先用24行两特征回归，再在本章变体中演示验证集与顺序切分。"
