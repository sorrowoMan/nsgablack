[[example]]
id = "capability-application-tool.unit_view"
title = "在真实搜索实例上观察只读结构 · 实际装配与扩展"
component_keys = ["tool.unit_view"]
kind = "documentation"
working_directory = "nsgablack"
summary = "想知道 NSGA2 当前到底持有哪些成员、视图来自哪个实例和版本，而不把 Adapter 的可写内部数组交给观察代码。UnitView 是脱离的结构快照；这里实际得到具有成员能力的 PopulationView。"
inputs = ["当前 nsgablack、blackbase 和 NumPy；复制现有 `examples/cases/bias_gallery` Project 到自己的工作目录，保留 `project_config.py`、`run_project.py` 和完整 `cases/bias_gallery/`。该 Project 的 `default` 组只有 `main` 阶段，会调用 `bias_gallery` Case，Project L0 提供 ResourceContext。本章不使用策略参数或组件覆盖；要换 Adapter/Bias，须同步修改绑定和报告，不能让旧观察器读取已被替换的实例。"]
steps = ["按下面逐个文件接入，各文件完整且不依赖别章。显式 initializer 和 mutator 归 Adapter；ClipRepair 归问题管线。"]
dependencies = ["当前 blackbase 与 nsgablack；ML 宿主另需 mlblack。每章按实际正式 Case 声明依赖和资源。"]
expected_outputs = ["打开 `results/unit_view.json`。detail.view_type 应为 PopulationView、readonly 为 true、完整送评后 identity_complete 为 true。比较 revision 时同时比较 identity；相同数值或相同 revision 不能跨实例冒充同一 Unit。所有章节的 refs、tokens、candidates、raw 与 selection 行序应对应；二维 Sphere 的 raw_objectives 每行应为坐标平方和，raw_violations 应为零。selection 是成员当次送评时的选择反馈，不是用最终参考群体重新评分所得；不要在报告阶段重算它来“校正”历史。"]
sources = [{ path = "nsgablack/docs/catalog_usage/UNIT_AND_BIAS_APPLICATIONS_CN.md", section = "tool.unit_view" }]

[[example]]
id = "capability-application-bias.population_diversity"
title = "度量成员分散程度，先不改变搜索 · 实际装配与扩展"
component_keys = ["bias.population_diversity"]
kind = "documentation"
working_directory = "nsgablack"
summary = "需要解释搜索是否挤在同一区域，先记录群体平均最近邻距离，避免把一个评分对象误当成会自动选父代、填种群或拒绝重复点的算法。"
inputs = ["当前 nsgablack、blackbase 和 NumPy；复制现有 `examples/cases/bias_gallery` Project 到自己的工作目录，保留 `project_config.py`、`run_project.py` 和完整 `cases/bias_gallery/`。该 Project 的 `default` 组只有 `main` 阶段，会调用 `bias_gallery` Case，Project L0 提供 ResourceContext。本章不使用策略参数或组件覆盖；要换 Adapter/Bias，须同步修改绑定和报告，不能让旧观察器读取已被替换的实例。"]
steps = ["按下面逐个文件接入，各文件完整且不依赖别章。显式 initializer 和 mutator 归 Adapter；ClipRepair 归问题管线。"]
dependencies = ["当前 blackbase 与 nsgablack；ML 宿主另需 mlblack。每章按实际正式 Case 声明依赖和资源。"]
expected_outputs = ["打开 `results/population_diversity.json`。detail 应有 scope=unit、direction=maximize、reason=mean_nearest_member_distance，value 非负。值为零可能来自重合成员或不足两个槽位，不等于运行失败；大值也不证明目标更优、可行或覆盖前沿。所有章节的 refs、tokens、candidates、raw 与 selection 行序应对应；二维 Sphere 的 raw_objectives 每行应为坐标平方和，raw_violations 应为零。selection 是成员当次送评时的选择反馈，不是用最终参考群体重新评分所得；不要在报告阶段重算它来“校正”历史。"]
sources = [{ path = "nsgablack/docs/catalog_usage/UNIT_AND_BIAS_APPLICATIONS_CN.md", section = "bias.population_diversity" }]

