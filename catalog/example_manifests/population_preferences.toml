[[example]]
id = "population-preference-application-unit-bridge"
title = "显式参考种群的新颖性软评分 · 完整装配与纯观察变体"
component_keys = ["bias.unit_preference", "bias.population_diversity"]
kind = "documentation"
working_directory = "nsgablack"
summary = "在现有 bias_gallery Project 的副本中绑定实际 NSGA2 实例，使用 PopulationDiversityPreference 与 UnitPreferenceBias 生成软选择奖励，并按最终成员引用读取 raw/selection 反馈。正文没有装配五个旧多样性类。"
inputs = ["保留 bias_gallery 标准 Project、Case 包与二维 SphereProblem；资源由原 Project L0 提供。", "完整替换副本 build_solver.py，包含明确 Adapter、Unit 绑定、BiasModule 和本地报告观察器，不依赖其它章节。"]
steps = ["构造 NSGA2、显式绑定参考实例、挂载 BiasModule，按原 Project 驱动候选修复与评估。", "用最终成员 SolutionRef 读取 raw/selection，整体 Unit 多样性只作为观察值。", "按正文执行装配检查和原运行入口；纯观察变体关闭软选择，但保留 Unit 距离报告。"]
dependencies = ["当前 blackbase、nsgablack 与 NumPy；沿用现有 CPU Project，不使用外部模型或网络服务。"]
parameters = [{name = "weight", value = "0.15", meaning = "最近邻距离转成最小化负增量后的单次外层权重。"}, {name = "owner_path", value = "bias_gallery/population_search", meaning = "明确参考 Adapter 的实例标签，不自动选择其它种群，也不限制候选来源范围。"}]
expected_outputs = ["用户运行后在副本 results/population_preference.json 读取本轮 run_id、Unit 身份、成员引用、raw/selection 及整体距离。", "原始 Sphere 目标不被偏好覆盖；纯观察变体的 raw/selection 相同。这里只给可执行入口和检查办法，未新增运行收据。"]
sources = [{path = "nsgablack/docs/catalog_usage/POPULATION_PREFERENCE_APPLICATIONS_CN.md", section = "bias.unit_preference"}]

