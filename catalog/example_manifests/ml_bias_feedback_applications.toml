[[example]]
id = "ml-bias-feedback-chain"
title = "ML反馈偏好 · 完整线性Case、L2与二维权重链"
component_keys = ["mlblack.bias.noop", "mlblack.bias.objective_weight", "mlblack.bias.objective_policy", "mlblack.bias.state_l2"]
kind = "documentation"
working_directory = "mlblack"
summary = "正式LearningSolver.add_bias顺序装配，无导数Gaussian消费投影反馈，逐行保留raw并核对L2、二维权重和真实指标阈值。"
inputs = ["完整catalog_codec_demo Project副本、两特征24行合成回归、LinearPoint三坐标、Gaussian、Report与Project L0。"]
