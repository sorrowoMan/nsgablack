dependencies = ["当前三仓和NumPy；不加载条件模型或操作外部池。"]
expected_outputs = ["ml_bias.json真实hints、步数系数与逐行公式；Branch与DynamicPool仅记录实际提示，未冒称自动路由/模型切换。"]
