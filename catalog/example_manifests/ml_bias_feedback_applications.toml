sources = [{ path = "nsgablack/docs/catalog_usage/ML_BIAS_FEEDBACK_APPLICATIONS_CN.md", section = "ml_bias.feedback" }, { path = "nsgablack/docs/catalog_usage/ML_BIAS_FEEDBACK_APPLICATIONS_CN.md", section = "ml_bias.host" }]

[[example]]
id = "ml-bias-context-consumers"
title = "ML上下文提示 · 显式L2消费者与分支/集合审计"
component_keys = ["mlblack.bias.optimization", "mlblack.bias.l2_scale", "mlblack.bias.branch_policy", "mlblack.bias.dynamic_pool"]
kind = "documentation"
working_directory = "mlblack"
summary = "OptimizationBias实际Case子类消费L2Scale并审计Branch/DynamicPool字符串提示，说明其不自动创建SolutionPool或切换模型的边界。"
inputs = ["同一正式完整线性Case副本、无状态project_context链、明确Case消费者、Report与资源授权。"]
