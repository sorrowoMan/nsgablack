[[example]]
id="ml-classical-etf-procedure-migration"
title="ETF既有程序Case · 本地数据/WalkForward接线与验证边界"
component_keys=["mlblack.example.etf_temporal_forecast"]
kind="documentation"
usage_status="migration_reference"
working_directory="mlblack"
summary="完整复用原Case的本地路径预检薄包装，明确walkforward参数位置、程序报告Artifact、目标可知时间/测试折权重/恢复闭包限制。"
inputs=["完整etf_temporal_forecast副本、既有本地收益parquet与pandas/sklearn/parquet依赖。"]
steps=["在副本保留原builder为assembly_original，新唯一builder显式配置本地文件/单ridge/最多两折。", "说明一送评多fit及五目标含义，迁移完成前不将程序报告称严格独立预测模型交付。"]
dependencies=["本地依赖和已有业务数据；不下载、不读数据、不执行拟合。"]
expected_outputs=["迁移参考，不把历史summary/程序Artifact或状态ok当已验收预测/恢复。"]
sources=[{path="nsgablack/docs/catalog_usage/ML_CLASSICAL_DOMAIN_CASES_APPLICATIONS_CN.md",section="classical.example.etf"}]

