title = "Feasibility软成本与raw硬门 · 完整Case接线"
component_keys = ["bias.feasibility"]
kind = "documentation"
working_directory = "nsgablack"
summary = "显式提供同次调用problem_data.constraint_violations，按阈值形成软罚，变体由Problem与raw硬门真正拒绝。"
