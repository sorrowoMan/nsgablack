[[example]]
id = "bias-domain-engineering-constraint-application"
title = "工程超出量软罚 · 完整公式与明确统计限制"
component_keys = ["bias.engineering_constraint"]
kind = "documentation"
working_directory = "nsgablack"
summary = "实际装配EngineeringConstraintBias，明确函数权重与安全系数、重复总体加权、异常有限软罚和get_constraint_status缺陷。"
