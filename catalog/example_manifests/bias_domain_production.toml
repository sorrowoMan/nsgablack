expected_outputs = ["本轮domain_scores.json中真实整数候选、raw数量误差与三项选择成本对齐；人口多样性/产品切换/BOM数量等未实现语义明确排除。"]
sources = [{ path = "nsgablack/docs/catalog_usage/BIAS_DOMAIN_AND_PRODUCTION_APPLICATIONS_CN.md", section = "bias.production_constraint" }, { path = "nsgablack/docs/catalog_usage/BIAS_DOMAIN_AND_PRODUCTION_APPLICATIONS_CN.md", section = "domain.shared_report" }, { path = "nsgablack/docs/catalog_usage/BIAS_DOMAIN_AND_PRODUCTION_APPLICATIONS_CN.md", section = "domain.shared_assembly" }]

[[example]]
id = "bias-domain-robustness-application"
title = "每候选场景标准差的软成本 · 完整Provider接线"
component_keys = ["bias.robustness"]
kind = "documentation"
working_directory = "nsgablack"
summary = "MonteCarlo正式Provider产生8次场景统计，RobustnessBias只消费当次mc_std；明确weight平方、聚合后power、成本和噪声恢复边界。"
inputs = ["独立bias_gallery Project、二维ScenarioCost、连续Pipeline、共用Report/薄builder；每候选场景均值与标准差。"]
steps = ["完整保存ScenarioCost、Robustness工厂与实际attach_evaluation，Report支持NumPy统计序列化。", "变体只改POWER，raw场景均值不变。"]
dependencies = ["当前nsgablack、blackbase、NumPy；无远程服务。"]
expected_outputs = ["domain_scores.json里mc_samples=8、mc_*数组、mean与mean+.04*std^POWER及delta_matches；不把candidate调度数混成场景调用数。"]
sources = [{ path = "nsgablack/docs/catalog_usage/BIAS_DOMAIN_AND_PRODUCTION_APPLICATIONS_CN.md", section = "bias.robustness" }, { path = "nsgablack/docs/catalog_usage/BIAS_DOMAIN_AND_PRODUCTION_APPLICATIONS_CN.md", section = "domain.continuous_pipeline" }, { path = "nsgablack/docs/catalog_usage/BIAS_DOMAIN_AND_PRODUCTION_APPLICATIONS_CN.md", section = "domain.shared_report" }, { path = "nsgablack/docs/catalog_usage/BIAS_DOMAIN_AND_PRODUCTION_APPLICATIONS_CN.md", section = "domain.shared_assembly" }]

