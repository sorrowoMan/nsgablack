"nsgablack.core" = "core"
"nsgablack.experiment" = "experiment"
"nsgablack.plugins" = "plugins"
"nsgablack.project" = "project"
"nsgablack.representation" = "representation"
"nsgablack.ui" = "ui"
"nsgablack.utils" = "utils"

[tool.setuptools.package-data]
"nsgablack.catalog" = [
    "DASHBOARD_PROTOCOL.md",
    "db.toml.example",
    "entries/*.toml",
]
"nsgablack.experiment" = ["db.toml.example"]
"nsgablack.project.scaffold" = [
    "project_template/*.md",
    "project_template/*.template",
    "project_template/cases/*.md",
]
"nsgablack.project.scaffold.case_template_solver" = [
    "*.template",
    "pipeline/*.template",
    "pipeline/operators/.gitkeep",
]
"nsgablack.project.scaffold.case_template_trainer" = [
    "*.template",
    "pipeline/*.template",
    "pipeline/operators/.gitkeep",
]


[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
# 渐进式类型检查：先不强制要求所有函数都有类型提示
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

# 排除不需要类型检查的目录
exclude = [
    "build/",
    "dist/",
    "examples/",
    "experiments/",
    "tests/",
    "__pycache__",
    ".git",
    "docs",
]

[[tool.mypy.overrides]]
# 新代码严格要求类型
module = "bias.*,core.*,solvers.*,surrogate.*,multi_agent.*,utils.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "bias: marks tests related to bias system",
    "surrogate: marks tests related to surrogate models",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/dist/*",
    "*/build/*",
    "*/examples/*",
    "*/experiments/*",
    "setup.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "@pytest.mark",
]
