[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsgablack"
version = "0.3.10"
description = "A decomposed optimization system with pipelines, biases, adapters, plugins"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "SorrowoMan", email = "sorrowo@foxmail.com"},
]
maintainers = [
    {name = "SorrowoMan", email = "sorrowo@foxmail.com"},
]
keywords = [
    "optimization",
    "multi-objective",
    "nsga-ii",
    "evolutionary-algorithms",
    "bias-system",
    "machine-learning",
    "bayesian-optimization"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "blackbase>=0.3.8,<0.4.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.5.0"]
parallel = ["joblib>=1.1.0"]
bayesian = ["skopt>=0.9.0"]
distributed = ["ray>=1.10.0"]
rag = ["openai>=1.0.0", "psycopg[binary]>=3.1.0"]
rag-local = ["sentence-transformers>=2.2.0", "psycopg[binary]>=3.1.0"]
rag-mcp = ["mcp>=1.0.0", "sentence-transformers>=2.2.0", "psycopg[binary]>=3.1.0"]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.910",
    "types-PyYAML>=6.0.12.20241230",
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=1.0.0",
    "sphinx-autodoc-typehints>=1.20.0",
    "jupyter>=1.0.0",
    "notebook>=6.4.0",
]
all = [
    "matplotlib>=3.5.0",
    "joblib>=1.1.0",
    "skopt>=0.9.0",
    "ray>=1.10.0"
]

[project.urls]
Homepage = "https://github.com/sorrowoMan/nsgablack"
Documentation = "https://github.com/sorrowoMan/nsgablack/tree/main/docs"
Repository = "https://github.com/sorrowoMan/nsgablack.git"
"Bug Tracker" = "https://github.com/sorrowoMan/nsgablack/issues"

[project.scripts]
nsgablack = "nsgablack.__main__:main"

