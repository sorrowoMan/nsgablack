# 默认开发环境：PostgreSQL（catalog + L0）+ Redis（L0 runtime）
# 启动：docker compose up -d
# 停止：docker compose down
# 清理数据：docker compose down -v

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nsgablack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nsgablack_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nsgablack"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
