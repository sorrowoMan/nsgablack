worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Existing workspace endpoints accept 20 MiB attachments and 15 MiB scans.
    # Keep their application limits; stream bodies instead of staging in tmpfs.
    client_max_body_size 32m;
    client_body_timeout 300s;
    send_timeout 300s;
    map $http_upgrade $catalog_connection { default upgrade; '' close; }
    # Listener identity is server-owned. Never select trust from request headers.
    map $server_port $catalog_auth_port { default 8089; 8615 8086; }
    map $server_port $catalog_tail_login { default ''; 8615 $http_tailscale_user_login; }
    map $server_port $catalog_tail_name { default ''; 8615 $http_tailscale_user_name; }
    # No employee workspace session or Tailscale identity reaches Streamlit.
    map $cookie__streamlit_xsrf $catalog_cookie {
        default "_streamlit_xsrf=$cookie__streamlit_xsrf";
        '' '';
    }
    server {
        listen 127.0.0.1:8080;
        listen 127.0.0.1:8615;
        location = /__catalog_access {
            internal;
            proxy_pass http://127.0.0.1:$catalog_auth_port/api/workspace/app-access?app=framework-catalog&action=read;
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Tailscale-User-Login $catalog_tail_login;
            proxy_set_header Tailscale-User-Name $catalog_tail_name;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
        location = /__workspace_access {
            internal;
            proxy_pass http://127.0.0.1:$catalog_auth_port/api/workspace/app-access?app=framework-workspace&action=read;
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Tailscale-User-Login $catalog_tail_login;
            proxy_set_header Tailscale-User-Name $catalog_tail_name;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
        location /apps/framework-catalog/ {
            auth_request /__catalog_access;
            proxy_pass http://127.0.0.1:8619;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Cookie $catalog_cookie;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $catalog_connection;
            proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
            proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
            proxy_set_header X-Xsrftoken $http_x_xsrftoken;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Accept $http_accept;
            proxy_set_header Accept-Encoding $http_accept_encoding;
            proxy_set_header User-Agent $http_user_agent;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_hide_header X-Powered-By;
            add_header Cache-Control "private, no-store" always;
        }
        location /apps/framework-workspace/ {
            auth_request /__workspace_access;
            proxy_pass http://127.0.0.1:18645;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Cookie $catalog_cookie;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $catalog_connection;
            proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
            proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
            proxy_set_header X-Xsrftoken $http_x_xsrftoken;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Accept $http_accept;
            proxy_set_header Accept-Encoding $http_accept_encoding;
            proxy_set_header User-Agent $http_user_agent;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_hide_header X-Powered-By;
            add_header Cache-Control "private, no-store" always;
        }
        location / {
            # The trusted listener exposes only the authenticated framework apps.
            if ($server_port != 8080) { return 404; }
            proxy_pass http://127.0.0.1:8089;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $catalog_connection;
            proxy_set_header Tailscale-User-Login '';
            proxy_set_header Tailscale-User-Name '';
            proxy_set_header Tailscale-User-Profile-Pic '';
            # Keep ordinary business/auth/helper headers and relative redirects.
            proxy_pass_request_headers on;
            proxy_redirect off;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_send_timeout 300s;
            proxy_read_timeout 3600s;
        }
    }
}
