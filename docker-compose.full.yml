# 全栈：PostgreSQL + Redis + nsgablack solver + mlblack trainer
# 启动：docker compose -f docker-compose.full.yml up -d
# 这个场景跑完整的 outer-search + inner-training 流水线

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nsgablack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nsgablack_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nsgablack"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  solver:
    build: .
    command: >
      python -c "
      import time
      print('nsgablack outer solver ready')
      time.sleep(999999)
      "
    environment:
      NSGABLACK_CATALOG_DB_URL: postgresql://postgres:nsgablack_dev@postgres:5432/nsgablack
      NSGABLACK_L0_POSTGRES_URL: postgresql://postgres:nsgablack_dev@postgres:5432/nsgablack
      NSGABLACK_L0_REDIS_URL: redis://redis:6379/0
      NSGABLACK_L0_NAMESPACE: nsgablack_full
      NSGABLACK_ARTIFACT_ROOT: /workspace/runs
    volumes:
      - runs:/workspace/runs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # mlblack trainer —— 独立容器，运行内层训练
  trainer:
    build:
      context: C:/Users/hp/Desktop/mlblack
      dockerfile: Dockerfile
    command: >
      python -c "
      import time
      print('mlblack inner trainer ready')
      time.sleep(999999)
      "
    environment:
      MLBACK_CATALOG_DB_URL: postgresql://postgres:nsgablack_dev@postgres:5432/nsgablack
    volumes:
      - runs:/workspace/runs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  runs:
